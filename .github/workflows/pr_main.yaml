name: "PR plan analyses"
on:
  pull_request:
    branches:
      - main
    
jobs:
  Configuration:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: "Checkout do código"
        uses: actions/checkout@v4

      - name: "defining ssh credentials for ec2"
        run: |
          mkdir .ssh 
          echo "${{ secrets.SSH_KEY_EC2_AWS_PRIVATE }}" > .ssh/terraform-key
          echo "${{ secrets.SSH_KEY_EC2_AWS }}" > .ssh/terraform-key.pub
          chmod 600 .ssh/terraform-key
          chmod 644 .ssh/terraform-key.pub

      - name: "Configure AWS credentials"
        uses:  aws-actions/Configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ARN }}
          aws-region: us-west-2

      - name: "Running applies"
        uses: hashicorp/setup-terraform@v3
        with: 
          terraform_version: 1.9.0

      - name: "terraform init"
        run: terraform init

      - name: "terraform plan"
        id: plan
        run: |
          terraform plan -no-color -out=tfplan | tee plan_terraform.txt
          # Build the whole "interactive" YAML here so it is parsed only once.
          # The plan goes into a literal block scalar (|), so ':' and '"' in it are safe.
          {
            echo "interactive<<INTERACTIVE_EOF"
            echo "fields:"
            echo "  - label: overview"
            echo "    properties:"
            echo "      type: textarea"
            echo "      description: Confirm the plan for terraform"
            echo "      readOnly: true"
            echo "      defaultValue: |"
            sed 's/^/        /' plan_terraform.txt
            echo "  - label: verify"
            echo "    properties:"
            echo '      display: Check "true" if you want to proceed with the terraform apply in branch main'
            echo "      type: boolean"
            echo "      defaultValue: false"
            echo "      required: true"
            echo "INTERACTIVE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: "Confirm plan"
        id: interactive-inputs
        uses: boasihq/interactive-inputs@v2
        with:
          ngrok-authtoken: ${{ secrets.NGROK_AUTH_KEY }}
          timeout: 160
          title: "Confirm the plan workflow, to make sure that the production environment is ok"
          interactive: ${{ steps.plan.outputs.interactive }}

      - name: "Analysing input"
        if: ${{ steps.interactive-inputs.outputs.verify == 'true' }}
        run: echo "Great! Now do the Merge and see the magic!"